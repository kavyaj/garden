intro:
- "Every step in my career has brought me a little closer to the life I want to build. I'm not there yet, but I'm getting there. 🙂"
- "I've often prioritised building a life that makes sense to *me* over chasing job titles or higher salaries. Sometimes, that meant taking a pay cut. Figuring out what success means to me was half the challenge."
- "It took a lot of late nights and a very patient partner to figure that out. Still does, honestly."
roles:
- years: 2025–now
  title: Founder
  org: StoryCV
  url: https://story.cv
  current: true
  line: Built this after noticing that most people struggle to put their work experiences into words.
- years: 2021–now
  title: Co-founder (Marketing)
  org: Resumey.Pro
  url: https://resumey.pro
  current: true
  line: Running marketing and revenue for a product built out of our own frustration. Every other tool was either too rigid or too complicated.
- years: 2018–2021
  title: Marketing & Product Manager
  org: Enabling.Win
  line: Worked across product and marketing for a B2B app, everything from feature design to running webinars for food industry specialists. The kind of role where no two days looked the same, which was so exciting!
- years: 2016–2018
  title: Instrument Reference Data Analyst
  org: J.P. Morgan
  line: 'Fixed Income and Equities data: process improvement and strategic change, working across business and technology teams. Where I learned to ask uncomfortable questions about processes that had “always been done this way.”'
- years: 2014–2016
  title: Trader Assistant, EMTN Private Placement
  org: Commerzbank
  line: Advisory, pricing and execution of notes for short-term funding for banks and supranationals across Asia. Buzzing, fast, and completely unlike anything I'd imagined.
- years: May–Jul 2013
  title: Summer Analyst, eFX IT
  org: Credit Suisse
  line: Where I first saw what technology looks like inside financial services.
- years: Jul–Dec 2012
  title: Intern Analyst
  org: Frost & Sullivan
  line: Market research across topics as wildly different as geology and economic liberalisation. My first lesson in learning to think about things I knew nothing about.
location: Singapore
