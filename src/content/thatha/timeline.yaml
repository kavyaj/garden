- year: '1934'
  text: Born on 23 January in Gattu, then part of Raichur district.
- year: '1945'
  text: Lost his mother to TB. He was about eleven.
- year: '1946'
  text: Rejoined school, after years of looking after his little brother.
- year: '1953'
  text: Passed his 10th class, the Matric.
- year: '1954'
  text: 'Joined the Government Technical College, Hyderabad, for a Diploma in Electrical Engineering. Fees: Rs 150, lent by his father''s boss.'
- year: '1957'
  text: Graduated and joined Indian Railways in Jabalpur as a Progress Supervisor. Married Sulochana Bai on 9 May.
- year: '1959'
  text: First child, Lalitha. Transferred to Hyderabad as Electrical Inspector for Construction.
- year: '1963'
  text: Instructor for Coil and Winding at the BHEL training school, Hyderabad.
- year: '1965'
  text: Inspector for Projects, BHEL factory.
- year: '1971'
  text: Senior Engineer for Projects, Bokaro. Known around town as his children's father.
- year: '1978'
  text: Back to Hyderabad as Manager for Projects.
- year: '1989'
  text: 'First car: a second-hand black Ambassador, Rs 30,000. It gave him a lot of trouble.'
- year: '1991'
  text: Took voluntary retirement, two years early.
- year: '1992'
  text: A white Maruti 800, after a three-year wait. He wanted brown.
- year: '1999'
  text: A white Esteem. Sold later, because the seats sat too low for my grandmother.
- gap: true
  text: 'Still to fill in: the Santro Xing, the i10, and fifteen years of life.'
- year: '2014'
  text: 26 May, Pune.
