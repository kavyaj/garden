words:
- phrase: Galgalaachari
  meaning: Anyone who takes far too long in the shower. Named after a fussy relative on the Chegoor side, famous for exactly that.
- phrase: Yenkya Nonya Seenya
  meaning: 'Roughly: Tom, Dick and Harry.'
- phrase: Howla paasha
  meaning: 'Roughly: fool.'
- phrase: Thali bolsa
  meaning: 'Literally, shave their heads, as families do after a death. His crude way of saying: leave it.'
- phrase: Kathi sath biddada
  meaning: The donkey has died. What he said when you looked at his plate during a meal. Mind your own business.
- phrase: Nona voddada
  meaning: The housefly has kicked. Said when barely anything happened, but the wound is being made out to be much bigger than it is.
- phrase: There is tomorrow also
  meaning: Said to us kids as we sat down to eat. Spare some food for tomorrow too. Teasing, mostly.
- phrase: Keep that donkey last
  meaning: Or, as it sometimes came out, keep that donkey lost. Don't start with "I". Put others before you.
- phrase: Nene dobryy
  meaning: Not good.
- phrase: Fool of an ass
  meaning: His endearing way of teasing his grandkids.
- phrase: Huccha
  meaning: Crazy, in Kannada.
- phrase: Allide mane, illige bande summane
  meaning: My house is elsewhere. I'm just a visitor here.
songs:
- title: A Telugu song he used to sing
  lyrics: 'Thatha tai thakkalaata

    Nenundedi Kurnoolu Kota

    Kota mundarane bommalaata

    Nenu kurchundedi kurchi peeta

    Peeta kindane bommala moota'
- title: A rhyme for teasing
  lyrics: 'Pau bella pau puthani

    Paikhanage kuthkonthana

    _______'
  note: Fill in the blank with the name of whoever you want to tease.
- title: Yedu vaaka saagaru rannu chinnanna
  lyrics: ''
  note: A line from a movie song.
