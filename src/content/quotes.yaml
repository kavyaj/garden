- id: kabir-mali
  original: "धीरे-धीरे रे मना, धीरे सब कुछ होय। माली सींचे सौ घड़ा, ऋतु आए फल होय।"
  translation: "Slowly, mind, everything happens slowly. The gardener pours a hundred pots of water, but fruit comes in its season."
  source: Kabir, 15th century
  why: The whole reason this site is a garden, in two lines.
  featured: true
  # Home shows just the second line, and the matching half of the translation.
  home:
    original: "माली सींचे सौ घड़ा, ऋतु आए फल होय।"
    translation: "The gardener pours a hundred pots of water, but fruit comes in its season."
  added: 2026-10-01

- id: sanchi-honnamma
  lang: kn
  original: "ಪೆಣ್ಣು ಪೆಣ್ಣೆಂದೇತಕೆ ಬೀಳುಗಳೆವರು?\nಕಣ್ಣು ಕಾಣದ ಗಾವಿಲರು!\nಪೆಣ್ಣಲ್ಲವೇ ನಮ್ಮನೆಲ್ಲ ಪಡೆದ ತಾಯಿ?"
  translit: "Pennu pennendethake beelugalevaru?\nKannu kaanada gaavilaru!\nPennallave nammanella padeda taayi?"
  translation: "Why do people look down upon a woman with such contempt? They are blind fools who cannot see! Is not a woman the mother who gave birth to us all?"
  source: "Sanchi Honnamma (ಸಂಚಿ ಹೊನ್ನಮ್ಮ), 17th-century Kannada poetry"
  why: "While this reflects the reality of many cultures, it is a reminder for us to pause and reflect the strength and power of women. I find it impressive how this 17th century Kannada poem addresses gender equality and the dignity of women."
  wide: true
  added: 2026-10-16
