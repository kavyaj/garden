# supplied by Kavya. If a cover file is missing, fall back to the lettered cover.

- title: The Annihilation of Caste
  author: B. R. Ambedkar
  cover: annihilation-of-caste
  goodreads_url: https://www.goodreads.com/book/show/24621582
  first_read: 2020
  reread: false
  featured: true
  note: "Words won't do justice to what this book means to me. It bridges the gap between what most of us are schooled to believe and what the reality is. It was published in the 1930s and it's still relevant now, which calls for introspection, not celebration. The change has to come from us."
  line: "If the fundamental rights are opposed by the community, no law, no parliament, no judiciary can guarantee them in the real sense of the word."

- title: Harry Potter Series
  author: J. K. Rowling
  cover: harry-potter
  first_read: 2007
  reread: true
  note: "I really imagined myself in their world. Read and reread so many times, queued up to grab the sixth book when it released, hid under blanket covers to read when I was supposed to be studying for my exam."

